<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar | Naomi Cristina</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#EDE8D0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/banco.js"></script>
<style>
:root{--bg:#EDE8D0;--red:#c8101a;--red-dark:#9a0a12;--card:#f7f3e2;--brown:#654321;--brown-dark:#4a3018;--line:#cfc19a}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--bg);color:var(--brown);font-family:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;line-height:1.5}
.cartao{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-top:5px solid var(--brown);border-radius:10px;padding:32px 28px;box-shadow:0 20px 50px rgba(101,67,33,.15)}
h1{margin:0 0 4px;font-size:1.25rem;color:var(--red)}
.sub{margin:0 0 22px;font-size:.9rem}
label{display:block;font-weight:600;font-size:.85rem;margin-bottom:5px}
.campo{margin-bottom:16px}
input{width:100%;background:#fcfaf0;color:var(--brown);border:2px solid var(--brown);border-radius:6px;padding:11px 12px;font:inherit}
input:focus{outline:3px solid var(--red);outline-offset:1px;border-color:var(--red)}
button{font:inherit;cursor:pointer}
.entrar{width:100%;min-height:46px;background:var(--brown);color:#EDE8D0;border:0;border-radius:6px;font-weight:700}
.entrar:hover{background:var(--brown-dark)}
.entrar[disabled]{opacity:.6;cursor:wait}
.link{background:none;border:0;padding:6px 0;color:var(--brown);text-decoration:underline;font-size:.88rem}
.link:hover{color:var(--red)}
.faixa{display:none;margin-bottom:16px;padding:11px 13px;border-radius:6px;font-size:.88rem;font-weight:500}
.faixa.mostrar{display:block}
.faixa.erro{background:#f9dcdc;color:#8a0c14;border:1px solid #e3a3a6}
.faixa.ok{background:#e1f0e0;color:#1c5a2c;border:1px solid #a9d2ac}
.rodape{margin-top:14px;text-align:center}
.oculto{display:none}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
</style>
</head>
<body>
<main class="cartao">
  <h1>Painel da Naomi</h1>
  <p class="sub" id="sub">Entre para gerenciar o seu portfólio.</p>

  <div class="faixa" id="faixa" role="alert"></div>

  <!-- Tela de entrar -->
  <form id="formEntrar" novalidate>
    <div class="campo"><label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required></div>
    <div class="campo"><label for="senha">Senha</label><input id="senha" type="password" autocomplete="current-password" required></div>
    <button class="entrar" id="btnEntrar" type="submit">Entrar</button>
    <div class="rodape"><button class="link" id="btnEsqueci" type="button">Esqueci minha senha</button></div>
  </form>

  <!-- Tela de criar nova senha (aparece só quando ela chega pelo link do e-mail de recuperação) -->
  <form id="formNova" class="oculto" novalidate>
    <div class="campo"><label for="novaSenha">Nova senha</label><input id="novaSenha" type="password" autocomplete="new-password" minlength="6" required></div>
    <div class="campo"><label for="novaSenha2">Repita a nova senha</label><input id="novaSenha2" type="password" autocomplete="new-password" minlength="6" required></div>
    <button class="entrar" id="btnNova" type="submit">Salvar nova senha</button>
  </form>
</main>

<script>
(function(){
  var db = window.db;
  var $ = function(id){ return document.getElementById(id); };
  var faixa = $('faixa');

  function aviso(texto, tipo){
    faixa.textContent = texto;
    faixa.className = 'faixa mostrar ' + (tipo || 'erro');
  }
  function limparAviso(){ faixa.className = 'faixa'; faixa.textContent = ''; }

  if(!db){
    aviso('Não consegui conectar ao servidor. Confira a internet e recarregue a página.');
    $('btnEntrar').disabled = true;
    return;
  }

  var vindoDaRecuperacao = /type=recovery/.test(location.hash);

  function mostrarNovaSenha(){
    $('formEntrar').classList.add('oculto');
    $('formNova').classList.remove('oculto');
    $('sub').textContent = 'Escolha a sua nova senha.';
    limparAviso();
  }

  /* Se já existe sessão aberta, vai direto para o painel (a não ser que ela tenha chegado pelo link de recuperar senha) */
  if(vindoDaRecuperacao){
    mostrarNovaSenha();
  } else {
    db.auth.getSession().then(function(r){
      if(r && r.data && r.data.session) location.replace('../admin/');
    });
  }

  db.auth.onAuthStateChange(function(evento){
    if(evento === 'PASSWORD_RECOVERY') mostrarNovaSenha();
  });

  $('formEntrar').addEventListener('submit', function(e){
    e.preventDefault();
    limparAviso();
    var email = $('email').value.trim(), senha = $('senha').value;
    if(!email || !senha){ aviso('Preencha o e-mail e a senha.'); return; }
    var btn = $('btnEntrar'); btn.disabled = true; btn.textContent = 'Entrando...';
    db.auth.signInWithPassword({ email: email, password: senha }).then(function(r){
      if(r.error){
        var m = (r.error.message || '').toLowerCase();
        if(m.indexOf('invalid') > -1 || m.indexOf('credentials') > -1) aviso('E-mail ou senha incorretos');
        else if(m.indexOf('confirm') > -1) aviso('Confirme o seu e-mail antes de entrar.');
        else aviso('Não consegui entrar agora. Tente de novo em instantes.');
        btn.disabled = false; btn.textContent = 'Entrar';
        return;
      }
      location.replace('../admin/');
    }).catch(function(){
      aviso('Não consegui conectar. Confira a internet e tente de novo.');
      btn.disabled = false; btn.textContent = 'Entrar';
    });
  });

  $('btnEsqueci').addEventListener('click', function(){
    limparAviso();
    var email = $('email').value.trim();
    if(!email){ aviso('Digite o seu e-mail no campo acima e clique de novo em "Esqueci minha senha".'); $('email').focus(); return; }
    var btn = $('btnEsqueci'); btn.disabled = true;
    db.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname }).then(function(r){
      btn.disabled = false;
      if(r.error){
        if((r.error.message || '').toLowerCase().indexOf('rate') > -1) aviso('Muitas tentativas. Espere um pouco e tente de novo.');
        else aviso('Não consegui enviar o e-mail agora. Tente de novo em instantes.');
        return;
      }
      aviso('Se esse e-mail tiver cadastro, você vai receber um link para criar uma nova senha. Olhe também a caixa de spam.', 'ok');
    }).catch(function(){ btn.disabled = false; aviso('Não consegui conectar. Confira a internet e tente de novo.'); });
  });

  $('formNova').addEventListener('submit', function(e){
    e.preventDefault();
    limparAviso();
    var a = $('novaSenha').value, b = $('novaSenha2').value;
    if(a.length < 6){ aviso('A senha precisa ter pelo menos 6 caracteres.'); return; }
    if(a !== b){ aviso('As duas senhas não são iguais.'); return; }
    var btn = $('btnNova'); btn.disabled = true;
    db.auth.updateUser({ password: a }).then(function(r){
      if(r.error){ btn.disabled = false; aviso('Não consegui salvar a nova senha. Peça um novo link e tente de novo.'); return; }
      aviso('Senha alterada! Entrando...', 'ok');
      setTimeout(function(){ location.replace('../admin/'); }, 900);
    }).catch(function(){ btn.disabled = false; aviso('Não consegui conectar. Tente de novo.'); });
  });
})();
</script>
</body>
</html>
