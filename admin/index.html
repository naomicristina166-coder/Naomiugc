<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel | Naomi Cristina</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#EDE8D0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/banco.js"></script>
<script src="../js/biblioteca.js"></script>
<style>
:root{
  --bg:#EDE8D0; --card:#f7f3e2; --alt:#e4dcbf; --line:#cfc19a;
  --red:#c8101a; --red-soft:rgba(200,16,26,.1); --brown:#654321; --brown-dark:#4a3018;
  --verde:#1c5a2c; --verde-bg:#e1f0e0; --amarelo:#7a5200; --amarelo-bg:#f7e3a6;
  --radius:10px; --menu:236px;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--brown);font-family:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px;line-height:1.45;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
svg.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:3px solid var(--red);outline-offset:2px;border-radius:4px}
.checando .app{display:none}
#carregando{display:none;position:fixed;inset:0;place-items:center;background:var(--bg);font-weight:600}
.checando #carregando{display:grid}

/* Estrutura */
.app{min-height:100vh}
.menu{position:fixed;inset:0 auto 0 0;width:var(--menu);background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px;z-index:60;transition:transform .25s}
.marca-menu{font-weight:700;color:var(--red);font-size:1.05rem;padding:4px 10px 16px}
.grupo{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;opacity:.65;padding:14px 10px 6px}
.item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;background:transparent;border-radius:8px;font-weight:500;text-align:left}
.item:hover{background:rgba(101,67,33,.08)}
.item[aria-current="page"]{background:var(--red-soft);color:var(--red);font-weight:700}
.rodape-menu{margin-top:auto;border-top:1px solid var(--line);padding:12px 6px 0}
.email{font-size:.78rem;word-break:break-all;margin-bottom:8px;opacity:.85}
.principal{margin-left:var(--menu);padding:22px 26px 60px;min-width:0}
.topo{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.topo h1{font-size:1.15rem;color:var(--red)}
.hamb{display:none;width:40px;height:40px;border:1px solid var(--line);background:var(--card);border-radius:8px;place-items:center}
.veu{display:none}

/* Blocos */
.painel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.painel h2{font-size:.95rem;margin-bottom:10px;color:var(--red)}
.faixa-num{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid var(--line);border-radius:var(--radius);background:var(--card);margin-bottom:16px;overflow:hidden}
.faixa-num.q4{grid-template-columns:repeat(4,1fr)}
.num{padding:12px 16px;border-right:1px solid var(--line);min-width:0}
.num:last-child{border-right:0}
.num small{display:block;font-size:.72rem;opacity:.8}
.num b{display:block;font-size:1.2rem;color:var(--red);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.num span{display:block;font-size:.74rem;opacity:.8}
.duas{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}
.duas.iguais{grid-template-columns:1fr 1fr}
.metas{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-bottom:22px}
.projs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.meta,.proj{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;min-width:0}
.meta-t{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.meta-t b{flex:1;min-width:0}
.meta-n{margin:4px 0 8px}
.meta-n b{font-size:1.3rem;color:var(--red)}
.add-passo{display:flex;gap:6px;margin-top:10px}
.cars{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.car{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;min-width:0}
.slides{margin:0 0 8px;padding-left:20px;font-size:.88rem}
.slides li{margin-bottom:3px;overflow-wrap:anywhere}
.legenda{margin-top:8px;padding:8px 10px;background:var(--alt);border-radius:8px;font-size:.85rem;overflow-wrap:anywhere}
.legenda small{display:block;font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:.68rem;opacity:.8}
.cs-ideia{background:#dcd6c4;color:#5a4d36}.cs-produzindo{background:#f7e3a6;color:#6b4a00}.cs-pronto{background:#d7e6f7;color:#1d4a7a}.cs-postado{background:#d3ecd3;color:#1c5a2c}
.link-b{background:none;border:0;padding:0;font:inherit;color:var(--red);text-decoration:underline}
.vazio{padding:20px;text-align:center;border:1px dashed var(--line);border-radius:8px;opacity:.9}
.aviso{background:var(--amarelo-bg);color:var(--amarelo);border:1px solid #e0c56a;border-radius:8px;padding:10px 12px;margin-bottom:14px;font-size:.85rem}
.aviso b{display:block}

/* Gráfico */
.barras{display:flex;align-items:flex-end;gap:6px;height:150px}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.bar{width:100%;max-width:26px;background:var(--red);border-radius:4px 4px 0 0;min-height:2px}
.bn{font-size:.7rem;font-weight:600;margin-bottom:2px}
.bl{font-size:.68rem;opacity:.75;margin-top:4px}
.orig{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:.82rem;margin-bottom:8px}
.orig i{grid-column:1/3;display:block;height:5px;border-radius:3px;background:var(--brown)}
.orig-fundo{grid-column:1/3;background:var(--alt);border-radius:3px;height:5px}

/* Tabelas */
.rolagem{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--card)}
table{width:100%;border-collapse:collapse;min-width:640px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;background:var(--alt);white-space:nowrap}
th button{background:none;border:0;padding:0;font:inherit;text-transform:inherit;letter-spacing:inherit;font-weight:700;display:inline-flex;gap:5px;align-items:center;white-space:nowrap}
th .seta{opacity:.35;font-size:.8em}
th .seta.on{opacity:1;color:var(--red)}
tr:last-child td{border-bottom:0}
tbody tr[data-linha]{cursor:pointer}
tbody tr[data-linha]:hover{background:rgba(101,67,33,.06)}
tr.fav{box-shadow:inset 4px 0 0 var(--red)}
tr.arrastando{background:var(--red-soft);opacity:.85}
.alca{cursor:grab;touch-action:none;background:none;border:0;padding:4px;opacity:.6;display:inline-flex}
.alca:hover{opacity:1}
.acoes{display:flex;gap:4px;white-space:nowrap}
.ic-btn{display:inline-grid;place-items:center;width:32px;height:32px;border:0;background:transparent;border-radius:6px}
.ic-btn:hover{background:rgba(101,67,33,.12)}
.ic-btn.perigo:hover{background:var(--red-soft);color:var(--red)}
.estrela.on svg{fill:var(--red);stroke:var(--red)}
.muted{opacity:.75}
.ellip{max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
a{color:var(--brown)}
a:hover{color:var(--red)}

/* Botões e campos */
.barra{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.barra .espaco{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:7px 14px;border-radius:8px;border:1px solid var(--brown);background:transparent;font-weight:600}
.btn:hover{background:rgba(101,67,33,.1)}
.btn.cheio{background:var(--brown);color:#EDE8D0}
.btn.cheio:hover{background:var(--brown-dark)}
.btn.perigo{border-color:var(--red);color:var(--red)}
.btn.mini{min-height:28px;padding:3px 10px;font-size:.8rem}
.btn[disabled]{opacity:.6;cursor:wait}
input,select,textarea{background:#fcfaf0;border:1px solid var(--brown);border-radius:8px;padding:8px 10px;width:100%}
input[type=checkbox]{width:auto}
.barra input[type=search],.barra select,.cal-cab select{width:auto;min-width:0}
.barra input[type=search]{flex:1;max-width:280px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--brown);background:transparent;border-radius:999px;padding:5px 13px;font-weight:600;font-size:.82rem}
.chip[aria-pressed="true"]{background:var(--brown);color:#EDE8D0}

/* Pílulas */
.pilula{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.74rem;font-weight:700;white-space:nowrap;border:0}
.s-lead{background:#f7e3a6;color:#6b4a00}.s-conversando{background:#d7e6f7;color:#1d4a7a}.s-cliente{background:#d3ecd3;color:#1c5a2c}.s-parada{background:#dcd6c4;color:#5a4d36}
.t-Conteúdo{background:#e7d6bd;color:#5a3a17}.t-Publicidade{background:#f6d3d5;color:#8a0c14}
.st-Briefing{background:#dcd6c4;color:#5a4d36}.st-Roteiro{background:#d7e6f7;color:#1d4a7a}.st-Aprovação{background:#e5dbf3;color:#4b2a7a}.st-Gravação{background:#f9dcc0;color:#8a3d00}.st-Edição{background:#f7e3a6;color:#6b4a00}.st-Aprovado{background:#cfeadf;color:#0f5a44}.st-Entregue{background:#d3ecd3;color:#1c5a2c}
.pg-pendente{background:#f7e3a6;color:#6b4a00;cursor:pointer}.pg-pago{background:#d3ecd3;color:#1c5a2c;cursor:pointer}
.ex{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:4px;font-size:.66rem;font-weight:700;background:var(--alt);border:1px dashed var(--brown);text-transform:uppercase;letter-spacing:.05em}
.etq{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:4px;font-size:.7rem;font-weight:700}
.etq{white-space:nowrap}
td .etq{display:block;width:max-content;margin:3px 0 0}
.etq.atraso{background:var(--red);color:#fff}.etq.breve{background:#f2c94c;color:#4a3300}

/* Calendário */
.cal-cab{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.cal-cab h2{font-size:1rem;min-width:150px;text-align:center}
.grade{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--card)}
.sem{padding:6px;text-align:center;font-size:.7rem;font-weight:700;text-transform:uppercase;background:var(--alt);border-bottom:1px solid var(--line)}
.dia{position:relative;min-height:96px;padding:4px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);cursor:pointer;min-width:0}
.dia:nth-child(7n){border-right:0}
.dia.fora{background:rgba(101,67,33,.06);opacity:.5}
.dia.hoje{background:var(--red-soft);box-shadow:inset 0 0 0 2px var(--red)}
.dia .n{font-size:.75rem;font-weight:700}
.dia.hoje .n{background:var(--red);color:#fff;border-radius:999px;padding:1px 7px}
.dia .mais-add{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:6px;border:1px solid var(--brown);background:var(--card);font-weight:700;line-height:1;opacity:0;padding:0}
.dia:hover .mais-add,.dia .mais-add:focus{opacity:1}
.it{display:block;width:100%;margin-top:3px;padding:2px 5px;border:0;border-radius:4px;font-size:.7rem;font-weight:600;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it.feito{text-decoration:line-through;opacity:.55}
.i-gravar{background:#f6d3d5;color:#8a0c14}.i-editar{background:#d7e6f7;color:#1d4a7a}.i-postar{background:#d3ecd3;color:#1c5a2c}.i-prazo{background:#e7d6bd;color:#5a3a17}
.mais-it{background:none;border:0;padding:2px 4px;font-size:.7rem;font-weight:700;text-decoration:underline;margin-top:2px}
.atras{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.atras:last-child{border-bottom:0}
.atras .t{flex:1;min-width:140px}

/* Checklist e biblioteca */
.subabas{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.prog{height:7px;background:var(--alt);border-radius:4px;overflow:hidden;min-width:70px}
.prog i{display:block;height:100%;background:var(--red)}
.sec{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px}
.sec-cab{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:0;background:none;text-align:left}
.sec-cab .emo{font-size:1.3rem}
.sec-cab .tx{flex:1;min-width:0}
.sec-cab .tx b{display:block}
.sec-cab .tx span{font-size:.8rem;opacity:.8}
.sec-cab .pr{display:flex;align-items:center;gap:8px;width:130px;font-size:.78rem}
.sec-cab .pr .prog{flex:1}
.sec-cab .seta-s{transition:transform .2s}
.sec-cab[aria-expanded="true"] .seta-s{transform:rotate(90deg)}
.sec-corpo{padding:0 14px 14px}
.porque{background:var(--alt);border-radius:8px;padding:10px 12px;margin-bottom:10px;font-size:.88rem}
.lin{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.lin input{margin-top:3px;flex:none}
.lin b{display:block;font-weight:600}
.lin span{font-size:.82rem;opacity:.85}
.geral{display:flex;align-items:center;gap:12px;margin-bottom:14px;font-weight:600}
.geral .prog{flex:1;max-width:340px;height:9px}
.refs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.ref{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--card);padding:0;text-align:left;display:block;width:100%}
.ref:hover{box-shadow:0 8px 20px rgba(101,67,33,.2);transform:translateY(-2px)}
.ref .capa{aspect-ratio:9/13;display:grid;place-items:center;font-size:2.6rem;position:relative}
.ref .capa span.dur{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.6);color:#fff;font-size:.7rem;padding:1px 6px;border-radius:4px}
.ref .inf{padding:8px 10px}
.ref .inf b{display:block;font-size:.85rem}
.ref .inf small{opacity:.8}
.c-coral{background:linear-gradient(160deg,#f2a08c,#c8534a)}.c-rosa{background:linear-gradient(160deg,#f3b7cb,#c25a86)}.c-mostarda{background:linear-gradient(160deg,#f0d067,#b8860b)}.c-terra{background:linear-gradient(160deg,#c9946a,#7a4a25)}.c-oliva{background:linear-gradient(160deg,#c3c98a,#6b7430)}.c-areia{background:linear-gradient(160deg,#eadcb5,#b39a63)}
.bloco-t{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:.86rem}
.bloco-t .tt{flex:none;width:74px;font-weight:700;color:var(--red)}
.ficha h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--red);margin:12px 0 4px}
.ficha p{font-size:.9rem}
.ideia{padding:8px 0;border-top:1px solid var(--line)}
.ideia b{display:block}
.ideia i{font-size:.86rem;opacity:.9}
textarea.roteiro{min-height:130px;margin-bottom:14px}

/* Modal e aviso */
.fundo{position:fixed;inset:0;background:rgba(40,25,10,.55);display:grid;place-items:center;padding:16px;z-index:100;overflow:auto}
.modal{background:var(--bg);border:1px solid var(--line);border-top:5px solid var(--brown);border-radius:var(--radius);width:100%;max-width:520px;max-height:92vh;display:flex;flex-direction:column}
.modal.larga{max-width:680px}
.m-topo{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
.m-topo h2{font-size:1rem;color:var(--red)}
.m-corpo{padding:16px;overflow:auto}
.grade-f{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cp.cheio,.chk.cheio{grid-column:1/3}
.cp label{display:block;font-weight:600;font-size:.8rem;margin-bottom:4px}
.cp small{display:block;opacity:.75;margin-top:3px;font-size:.74rem}
.chk{display:flex;align-items:center;gap:8px;font-weight:600}
.m-acoes{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.m-acoes .espaco{flex:1}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--brown);color:#EDE8D0;padding:10px 16px;border-radius:8px;z-index:200;font-weight:600;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.toast.erro{background:var(--red)}

@media (max-width:1000px){.faixa-num{grid-template-columns:repeat(3,1fr)}.faixa-num.q4{grid-template-columns:repeat(2,1fr)}.num{border-bottom:1px solid var(--line)}.duas,.duas.iguais{grid-template-columns:1fr}}
@media (max-width:860px){
  .menu{transform:translateX(-100%);box-shadow:0 0 40px rgba(0,0,0,.3)}
  .menu.aberto{transform:none}
  .veu.aberto{display:block;position:fixed;inset:0;background:rgba(40,25,10,.45);z-index:55}
  .principal{margin-left:0;padding:14px 14px 50px}
  .hamb{display:grid}
}
@media (max-width:560px){
  .faixa-num,.faixa-num.q4{grid-template-columns:repeat(2,1fr)}
  .num b{white-space:normal;font-size:1.05rem}
  .grade-f{grid-template-columns:1fr}.cp.cheio,.chk.cheio{grid-column:auto}
  .dia{min-height:74px;padding:2px}
  .it{font-size:.62rem;padding:1px 3px}
  .sec-cab .pr{width:80px}
  .barras{gap:3px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body class="checando">
<div id="carregando">Conferindo o seu acesso...</div>
<noscript><p style="padding:20px">Ative o JavaScript para usar o painel.</p></noscript>

<div class="app">
  <div class="veu" id="veu" data-acao="menu"></div>
  <aside class="menu" id="menu" aria-label="Menu do painel">
    <div class="marca-menu">Naomi Cristina</div>
    <nav>
      <div class="grupo">Início</div>
      <button class="item" data-acao="ir" data-aba="painel"><span data-ic="painel"></span>Painel</button>
      <button class="item" data-acao="ir" data-aba="objetivos"><span data-ic="objetivos"></span>Objetivos</button>
      <div class="grupo">Meu site</div>
      <button class="item" data-acao="ir" data-aba="portfolio"><span data-ic="portfolio"></span>Portfólio</button>
      <button class="item" data-acao="ir" data-aba="marcas"><span data-ic="marcas"></span>Marcas</button>
      <div class="grupo">Instagram</div>
      <button class="item" data-acao="ir" data-aba="carrosseis"><span data-ic="carrosseis"></span>Carrosséis</button>
      <div class="grupo">Minha rotina</div>
      <button class="item" data-acao="ir" data-aba="calendario"><span data-ic="calendario"></span>Calendário</button>
      <button class="item" data-acao="ir" data-aba="campanhas"><span data-ic="campanhas"></span>Campanhas</button>
      <button class="item" data-acao="ir" data-aba="checklist"><span data-ic="checklist"></span>Checklist</button>
    </nav>
    <div class="rodape-menu">
      <div class="email" id="emailLogado"></div>
      <button class="btn mini" data-acao="sair"><span data-ic="sair"></span>Sair</button>
    </div>
  </aside>
  <main class="principal">
    <div class="topo">
      <button class="hamb" data-acao="menu" aria-label="Abrir menu"><span data-ic="menu"></span></button>
      <h1 id="titulo">Portfólio</h1>
    </div>
    <div id="conteudo" aria-live="polite"></div>
  </main>
</div>

<script>
/* ============================================================
   1) A PRIMEIRA COISA: conferir a sessão. Sem sessão, vai para o login.
   A página só aparece depois dessa conferência.
   ============================================================ */
(function(){
  var db = window.db;
  if(!db){
    document.getElementById('carregando').textContent = 'Não consegui conectar ao servidor. Confira a internet e recarregue a página.';
    return;
  }
  db.auth.getSession().then(function(r){
    var sessao = r && r.data && r.data.session;
    if(!sessao){ location.replace('../login/'); return; }
    db.auth.onAuthStateChange(function(ev){ if(ev === 'SIGNED_OUT') location.replace('../login/'); });
    iniciar(sessao);
  }).catch(function(){
    document.getElementById('carregando').textContent = 'Não consegui conferir o seu acesso. Recarregue a página.';
  });
})();

/* ============================================================
   2) FERRAMENTAS
   ============================================================ */
var $ = function(s, r){ return (r || document).querySelector(s); };

/* Traduz os erros do banco para português simples */
function msgErro(e){
  var c = e && e.code, m = (e && e.message) || '';
  if(c === 'PGRST205' || c === '42P01') return 'a tabela não existe no banco';
  if(c === 'PGRST204' || c === '42703') return 'falta um campo no banco (' + m.replace(/'/g, '') + ')';
  if(c === '42501' || /row-level|permission/i.test(m)) return 'sem permissão (confira se você entrou com o seu e-mail)';
  if(c === '23514') return 'algum valor não é aceito pelo banco (confira as opções escolhidas)';
  if(/fetch|network/i.test(m)) return 'sem conexão com a internet';
  return m || 'erro desconhecido';
}

/* Baixar planilha CSV que abre certinho no Excel (com acento). Protege contra fórmulas maliciosas. */
function baixarCSV(nome, linhas){
  var cel = function(c){
    var t = String(c == null ? '' : c);
    var inofensivo = /^@[A-Za-z0-9._]+$/.test(t) || /^[+\-]?[\d\s().,-]+$/.test(t); /* @usuario e telefones passam direto */
    if(/^[=+\-@\t\r]/.test(t) && !inofensivo) t = "'" + t;
    return '"' + t.replace(/"/g, '""') + '"';
  };
  var csv = '﻿' + linhas.map(function(l){ return l.map(cel).join(';'); }).join('\r\n');
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
  a.download = nome; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
}

async function carregar(t){
  try{
    var q = window.db.from(t).select('*');
    if(t === 'videos') q = q.order('ordem', {ascending:true});
    if(t === 'visitas'){
      var d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() - 13);
      q = q.gte('data', d.toISOString()).order('data', {ascending:false}).limit(5000);
    }
    var r = await q;
    if(r.error) throw r.error;
    if(t === 'marcados'){ S.marcados = {}; (r.data || []).forEach(function(x){ if(x.marcado !== false) S.marcados[x.chave] = true; }); }
    else S[t] = r.data || [];
    delete falta[t];
  }catch(e){
    if(t === 'marcados') S.marcados = {}; else S[t] = [];
    falta[t] = msgErro(e);
  }
}

function avisoFalta(tabs){
  var l = tabs.filter(function(t){ return falta[t]; });
  if(!l.length) return '';
  return '<div class="aviso" role="alert"><b>Não consegui ler ' + (l.length > 1 ? 'algumas informações' : 'uma informação') + ' do banco.</b>' +
    l.map(function(t){ return esc(t) + ': ' + esc(falta[t]); }).join('<br>') +
    '<br>Cole o arquivo banco.sql no SQL Editor do Supabase e clique em Run. O resto do painel continua funcionando.</div>';
}

async function inserir(t, obj){
  var r = await window.db.from(t).insert(obj).select().single();
  if(r.error){ toast('Não consegui salvar: ' + msgErro(r.error), 'erro'); return null; }
  S[t].push(r.data); delete falta[t]; return r.data;
}
async function atualizar(t, id, patch){
  var r = await window.db.from(t).update(patch).eq('id', id).select().single();
  if(r.error){ toast('Não consegui salvar: ' + msgErro(r.error), 'erro'); return null; }
  var i = S[t].findIndex(function(x){ return x.id === id; });
  if(i > -1) S[t][i] = r.data; return r.data;
}
async function apagar(t, id){
  var r = await window.db.from(t).delete().eq('id', id);
  if(r.error){ toast('Não consegui apagar: ' + msgErro(r.error), 'erro'); return false; }
  S[t] = S[t].filter(function(x){ return x.id !== id; }); return true;
}

/* cfg: {titulo, campos:[{k,rot,tipo,op,req,dica,cheio,lista,passo}], valores, onSalvar(vals), onApagar(), aoMudar(k,valor,form)} */
function abrirForm(cfg){
  var id = 'f' + Date.now(), v = cfg.valores || {};
  var html = cfg.campos.map(function(c){
    var val = v[c.k], at = 'id="' + id + '_' + c.k + '" name="' + c.k + '"' + (c.req ? ' required' : '');
    if(c.tipo === 'checkbox') return '<label class="chk' + (c.cheio ? ' cheio' : '') + '"><input type="checkbox" name="' + c.k + '"' + (val ? ' checked' : '') + '> ' + esc(c.rot) + '</label>';
    var inp;
    if(c.tipo === 'select') inp = '<select ' + at + '>' + c.op.map(function(o){ return '<option value="' + esc(o[0]) + '"' + (String(val) === String(o[0]) ? ' selected' : '') + '>' + esc(o[1]) + '</option>'; }).join('') + '</select>';
    else if(c.tipo === 'textarea') inp = '<textarea ' + at + ' rows="' + (c.linhas || 3) + '">' + esc(val) + '</textarea>';
    else inp = '<input type="' + (c.tipo || 'text') + '" ' + at + ' value="' + esc(val) + '"' + (c.passo ? ' step="' + c.passo + '"' : '') + (c.lista ? ' list="' + id + '_l"' : '') + '>' +
      (c.lista ? '<datalist id="' + id + '_l">' + c.lista.map(function(x){ return '<option value="' + esc(x) + '">'; }).join('') + '</datalist>' : '');
    return '<div class="cp' + (c.cheio ? ' cheio' : '') + '"><label for="' + id + '_' + c.k + '">' + esc(c.rot) + (c.req ? ' *' : '') + '</label>' + inp + (c.dica ? '<small>' + esc(c.dica) + '</small>' : '') + '</div>';
  }).join('');
  var m = modal(cfg.titulo,
    '<form id="' + id + '" novalidate><div class="grade-f">' + html + '</div><div class="m-acoes">' +
    (cfg.onApagar ? '<button type="button" class="btn perigo" data-x="apagar">Apagar</button>' : '') + '<span class="espaco"></span>' +
    '<button type="button" class="btn" data-acao="fechar">Cancelar</button><button type="submit" class="btn cheio">Salvar</button></div></form>');
  var f = m.querySelector('form');
  if(cfg.aoMudar) f.addEventListener('change', function(e){ if(e.target.name) cfg.aoMudar(e.target.name, e.target.type === 'checkbox' ? e.target.checked : e.target.value, f); });
  f.addEventListener('submit', async function(e){
    e.preventDefault();
    var o = {};
    for(var i = 0; i < cfg.campos.length; i++){
      var c = cfg.campos[i], el = f.elements[c.k];
      if(c.tipo === 'checkbox') o[c.k] = el.checked;
      else if(c.tipo === 'number') o[c.k] = el.value === '' ? null : Number(el.value);
      else { var t = el.value.trim(); o[c.k] = t === '' ? null : t; }
      if(c.req && (o[c.k] === null)){ el.focus(); toast('Preencha: ' + c.rot, 'erro'); return; }
    }
    var b = f.querySelector('[type=submit]'); b.disabled = true;
    var ok = await cfg.onSalvar(o);
    if(ok === false || ok === null){ b.disabled = false; return; }
    fecharModal(); renderizar();
  });
  var ap = f.querySelector('[data-x=apagar]');
  if(ap) ap.addEventListener('click', async function(){
    if(!confirm('Apagar este item? Isso não pode ser desfeito.')) return;
    var ok = await cfg.onApagar();
    if(ok !== false){ fecharModal(); renderizar(); toast('Apagado'); }
  });
}

/* Visitas dos últimos 14 dias, contadas por dia e por origem (usado no Portfólio e no Painel) */

  var dias = [], cont = {}, i, d;
  for(i = 13; i >= 0; i--){ d = new Date(); d.setDate(d.getDate() - i); dias.push(iso(d)); cont[iso(d)] = 0; }

  S.visitas.forEach(function(v){
    var dia = iso(new Date(v.data));
    if(dia in cont){ cont[dia]++; total++; var o = v.origem || 'Direto'; origens[o] = (origens[o] || 0) + 1; }
  });
  return {dias:dias, cont:cont, origens:origens, total:total};
}

async function salvarOrdem(ids){
  var mudou = [];
  ids.forEach(function(id, i){ var v = achar('videos', id); if(v && v.ordem !== i + 1) mudou.push([id, i + 1]); });
  if(!mudou.length) return;
  var r = await Promise.all(mudou.map(function(x){ return window.db.from('videos').update({ordem:x[1]}).eq('id', x[0]); }));
  if(r.some(function(x){ return x.error; })){ toast('Não consegui salvar a nova ordem: ' + msgErro(r.find(function(x){ return x.error; }).error), 'erro'); await carregar('videos'); renderizar(); return; }
  mudou.forEach(function(x){ achar('videos', x[0]).ordem = x[1]; });
  toast('Ordem salva');
}

/* Arrastar pela alça (funciona com mouse e com o dedo) */
document.addEventListener('pointerdown', function(e){
  var h = e.target.closest('[data-alca]'); if(!h) return;
  var tr = h.closest('tr'), corpo = tr.parentNode; e.preventDefault();
  tr.classList.add('arrastando'); try{ h.setPointerCapture(e.pointerId); }catch(x){}
  function mover(ev){
    var alvo = document.elementFromPoint(ev.clientX, ev.clientY);
    alvo = alvo && alvo.closest('tr[data-id]');
    if(!alvo || alvo === tr || alvo.parentNode !== corpo) return;
    var r = alvo.getBoundingClientRect();
    corpo.insertBefore(tr, ev.clientY < r.top + r.height / 2 ? alvo : alvo.nextSibling);
  }
  function fim(){
    h.removeEventListener('pointermove', mover); h.removeEventListener('pointerup', fim); h.removeEventListener('pointercancel', fim);
    tr.classList.remove('arrastando');
    salvarOrdem(Array.prototype.map.call(corpo.querySelectorAll('tr[data-id]'), function(t){ return t.dataset.id; }));
  }

function itensCal(){
  var m = {};

  if(E.cal.tipo !== 'prazo') S.calendario.forEach(function(c){
    if(!c.data || (E.cal.tipo && c.tipo !== E.cal.tipo)) return;
    push(c.data, {o:'cal', id:c.id, tipo:c.tipo, titulo:c.titulo, marca:c.marca, feito:c.status === 'feito'});
  });
  if(!E.cal.tipo || E.cal.tipo === 'prazo') S.campanhas.forEach(function(c){
    if(!c.prazo || c.exemplo) return;
    push(c.prazo, {o:'camp', id:c.id, tipo:'prazo', titulo:'Prazo: ' + c.campanha, marca:c.cliente, feito:c.status === 'Entregue'});
  });
  return m;
}

function compCamp(a, b){

var pct = function(a, b){ return Number(b) > 0 ? Math.max(0, Math.min(100, Math.round(Number(a || 0) / Number(b) * 100))) : 0; };
var num = function(n){ return Number(n || 0).toLocaleString('pt-BR'); };
var barraPct = function(p){ return '<div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + p + '"><i style="width:' + p + '%"></i></div>'; };
var campAtrasada = function(c){ return !c.exemplo && c.prazo && c.prazo < hoje() && c.status !== 'Entregue'; };

function metaBloco(m, compacta){
  var p = pct(m.atual, m.alvo), un = m.unidade ? ' ' + esc(m.unidade) : '';
  var falt = Math.max(0, Number(m.alvo || 0) - Number(m.atual || 0));
  var prazo = '';
  if(m.prazo){
    var d = diffDias(m.prazo, hoje());
    prazo = d < 0 ? '<span class="etq atraso">Prazo vencido há ' + plural(-d, 'dia', 'dias') + '</span>' : '<span class="muted">Faltam ' + plural(d, 'dia', 'dias') + ' (' + br(m.prazo) + ')</span>';
  }
  return '<div class="meta"><div class="meta-t"><b>' + esc(m.titulo) + '</b>' + (m.exemplo ? '<span class="ex">Exemplo</span>' : '') +
    (compacta ? '' : '<button class="ic-btn" data-acao="meta-editar" data-id="' + esc(m.id) + '" aria-label="Editar meta">' + ic('editar') + '</button>') + '</div>' +
    '<div class="meta-n"><b>' + num(m.atual) + '</b> de ' + num(m.alvo) + un + ' <span class="muted">(' + p + '%)</span></div>' + barraPct(p) +
    '<div class="muted" style="margin-top:6px;font-size:.8rem">' + (Number(m.alvo) > 0 && falt === 0 ? 'Meta batida!' : 'Faltam ' + num(falt) + un) + (prazo ? ' · ' : '') + prazo + '</div></div>';
}

function vPainel(){

  var receber = camp.filter(function(c){ return c.pagamento !== 'pago'; }).reduce(function(t, c){ return t + Number(c.valor || 0); }, 0);
  var tarefas = S.calendario.filter(function(c){ return !c.exemplo && c.data && c.status !== 'feito'; });
  var atrasadas = tarefas.filter(function(c){ return c.data < hj; }).length + camp.filter(campAtrasada).length;
  var lim = new Date(); lim.setDate(lim.getDate() + 7); lim = iso(lim);
  var hojeL = tarefas.filter(function(c){ return c.data === hj; }).map(function(c){ return {t:c.titulo, tipo:c.tipo, d:c.data, m:c.marca}; });
  camp.forEach(function(c){ if(c.prazo === hj && c.status !== 'Entregue') hojeL.push({t:'Prazo: ' + c.campanha, tipo:'prazo', d:c.prazo, m:c.cliente}); });
  var prox = tarefas.filter(function(c){ return c.data > hj && c.data <= lim; }).map(function(c){ return {t:c.titulo, tipo:c.tipo, d:c.data, m:c.marca}; });
  camp.forEach(function(c){ if(c.prazo && c.prazo > hj && c.prazo <= lim && c.status !== 'Entregue') prox.push({t:'Prazo: ' + c.campanha, tipo:'prazo', d:c.prazo, m:c.cliente}); });

    '<div class="num"><small>Campanhas ativas</small><b>' + camp.filter(function(c){ return c.ativa; }).length + '</b></div>' +
    '<div class="num"><small>A receber</small><b>' + moeda(receber) + '</b></div>' +
    '<div class="num"><small>Ficou pra trás</small><b>' + atrasadas + '</b><span>' + (atrasadas ? '<button class="link-b" data-acao="ir" data-aba="calendario">ver no calendário</button>' : 'tudo em dia') + '</span></div></div>' +
    '<div class="duas iguais"><div class="painel"><h2>Para hoje</h2>' + (hojeL.length ? hojeL.map(function(x){ return linha(x, false); }).join('') : '<div class="vazio">Nada marcado para hoje.</div>') + '</div>' +

    '<div class="duas iguais"><div class="painel"><h2>Metas</h2>' + (metas.length ? '<div class="metas" style="margin:0">' + metas.map(function(m){ return metaBloco(m, true); }).join('') + '</div>' : '<div class="vazio">Você ainda não criou metas. Vá em Objetivos para começar.</div>') + '<div style="margin-top:10px"><button class="btn mini" data-acao="ir" data-aba="objetivos">Abrir Objetivos</button></div></div>' +

    '<div style="margin-top:12px"><button class="btn mini" data-acao="ir" data-aba="marcas">Abrir Marcas</button></div></div></div>';
}

function projetoBloco(p){

    await salvarPassos(p.id, (p.passos || []).filter(function(x, i){ return i !== Number(b.dataset.i); }));
  },
  'marca-nova':function(){ formMarca(); },
  'marca-csv':function(){
    var l = S.marcas.filter(function(m){ return !m.exemplo; });
    if(!l.length){ toast('Ainda não há marcas para baixar (a linha de exemplo não entra).', 'erro'); return; }
    baixarCSV('marcas.csv', [['Marca','Instagram','E-mail','Telefone','Situação','Observação','Último contato']].concat(l.map(function(m){ return [m.nome, m.instagram, m.email, m.telefone, m.situacao, m.obs, br(m.ultimo_contato)]; })));
  },
  'cal-novo':function(b){ fecharModal(); formCal(null, b.dataset.data); },
  'cal-item':function(b){ fecharModal(); if(b.dataset.o === 'camp') formCamp(b.dataset.id); else formCal(b.dataset.id); },
  'cal-dia':function(b){ abrirDia(b.dataset.data); },
  'cal-feito':async function(b){ if(await atualizar('calendario', b.dataset.id, {status:'feito'})){ var m = $('#modal'); if(m) fecharModal(); renderizar(); toast('Marcado como feito'); } },
  'cal-mes':function(b){ var d = new Date(E.cal.ano, E.cal.mes + Number(b.dataset.d), 1); E.cal.ano = d.getFullYear(); E.cal.mes = d.getMonth(); renderizar(); },
  'cal-hoje':function(){ var d = new Date(); E.cal.ano = d.getFullYear(); E.cal.mes = d.getMonth(); renderizar(); },
  'camp-nova':function(){ formCamp(); },
  'camp-filtro':function(b){ E.camp.filtro = b.dataset.f; renderizar(); },
  'camp-ord':function(b){ var k = b.dataset.k; if(E.camp.ord === k) E.camp.dir *= -1; else { E.camp.ord = k; E.camp.dir = 1; } pintarCamp(); },
  'camp-fav':async function(b){ var c = achar('campanhas', b.dataset.id); if(c && await atualizar('campanhas', c.id, {favorita:!c.favorita})) pintarCamp(); },
  'camp-pag':async function(b){ var c = achar('campanhas', b.dataset.id); if(c && await atualizar('campanhas', c.id, {pagamento:c.pagamento === 'pago' ? 'pendente' : 'pago'})){ renderizar(); } },
  'camp-csv':function(){
    var l = campFiltradas().filter(function(c){ return !c.exemplo; });
    if(!l.length){ toast('Ainda não há campanhas para baixar (a linha de exemplo não entra).', 'erro'); return; }
    baixarCSV('campanhas.csv', [['Campanha','Cliente','Tipo','Status','Qtd','Valor','Prazo','Pagamento','Ativa']].concat(l.map(function(c){
      return [c.campanha, c.cliente, c.tipo, c.status, c.qtd, String(Number(c.valor || 0).toFixed(2)).replace('.', ','), br(c.prazo), c.pagamento, c.ativa ? 'Sim' : 'Não'];
    })));
  },
  sub:function(b){ E.chk.sub = b.dataset.s; renderizar(); },
  'chk-secao':function(b){ E.chk.abertas[b.dataset.id] = !E.chk.abertas[b.dataset.id]; renderizar(); },
  'ref-estilo':function(b){ E.chk.estilo = b.dataset.e; renderizar(); },
  'ref-abrir':function(b){ fichaRef(b.dataset.id); },
  'nicho-sel':function(b){ E.chk.nicho = Number(b.dataset.i); renderizar(); },
  'rev-limpar':function(){ E.chk.rev = {}; var t = ($('#roteiro-txt') || {}).value; renderizar(); var n = $('#roteiro-txt'); if(n) n.value = t || ''; }
};
document.addEventListener('click', function(e){
  var b = e.target.closest('[data-acao]');
  if(b){ var f = ACOES[b.dataset.acao]; if(f){ e.stopPropagation(); f(b, e); } return; }
  var tr = e.target.closest('tr[data-linha]');
  if(tr && !e.target.closest('a,button,input,select')){
    var p = tr.dataset.linha.split(':');
    if(p[0] === 'marca') formMarca(p[1]); else formCamp(p[1]);
    return;
  }
  var dia = e.target.closest('.dia[data-dia]');
  if(dia && !e.target.closest('button')) formCal(null, dia.dataset.dia);
});
document.addEventListener('input', function(e){
  if(e.target.id === 'busca-marcas'){ E.marcas.busca = e.target.value; pintarMarcas(); }
  if(e.target.id === 'busca-camp'){ E.camp.busca = e.target.value; pintarCamp(); }
});
document.addEventListener('change', async function(e){
  var t = e.target;
  if(t.id === 'filtro-marcas'){ E.marcas.sit = t.value; pintarMarcas(); }
  else if(t.id === 'cal-tipo'){ E.cal.tipo = t.value; renderizar(); }
  else if(t.dataset && t.dataset.rev){ E.chk.rev[t.dataset.rev] = t.checked; var tx = ($('#roteiro-txt') || {}).value; renderizar(); var n = $('#roteiro-txt'); if(n) n.value = tx || ''; }
  else if(t.dataset && t.dataset.passo){
    var pp = t.dataset.passo.split(':'), proj = achar('projetos', pp[0]); if(!proj) return;
    var np = (proj.passos || []).map(function(x, i){ return i === Number(pp[1]) ? {t:x.t, feito:t.checked} : x; });
    await salvarPassos(proj.id, np);
  }
  else if(t.dataset && t.dataset.chk){
    var ch = t.dataset.chk, marcou = t.checked;
    if(marcou) S.marcados[ch] = true; else delete S.marcados[ch];
    var r = marcou ? await window.db.from('marcados').upsert({chave:ch, marcado:true, atualizado_em:new Date().toISOString()}) : await window.db.from('marcados').delete().eq('chave', ch);
    if(r.error){
      toast('Não consegui salvar essa marcação: ' + msgErro(r.error), 'erro');
      if(marcou) delete S.marcados[ch]; else S.marcados[ch] = true;
    }
    renderizar();
  }
});
document.addEventListener('keydown', function(e){
  if(e.key === 'Enter' && e.target.id && e.target.id.indexOf('np-') === 0){ e.preventDefault(); var b = e.target.parentNode.querySelector('[data-acao=passo-novo]'); if(b) b.click(); }
  if(e.key === 'Escape'){ fecharModal(); $('#menu').classList.remove('aberto'); $('#veu').classList.remove('aberto'); } });
window.addEventListener('hashchange', function(){ var a = location.hash.slice(1); if(ABAS[a] && a !== E.aba){ E.aba = a; renderizar(); } });

async function iniciar(sessao){
  sessaoAtual = sessao;
  document.querySelectorAll('[data-ic]').forEach(function(s){ s.innerHTML = ic(s.dataset.ic); });
  $('#emailLogado').textContent = (sessao.user && sessao.user.email) || '';
  var d = new Date(); E.cal.ano = d.getFullYear(); E.cal.mes = d.getMonth();
  var a = location.hash.slice(1); if(ABAS[a]) E.aba = a;
  document.body.classList.remove('checando');
  $('#conteudo').innerHTML = '<div class="vazio">Carregando os seus dados...</div>';
  document.querySelectorAll('.item').forEach(function(b){ if(b.dataset.aba === E.aba) b.setAttribute('aria-current', 'page'); });
  await Promise.all(['videos', 'marcas', 'calendario', 'campanhas', 'marcados', 'visitas', 'metas', 'projetos', 'carrosseis'].map(carregar));
  renderizar();
}
</script>
</body>
</html>
